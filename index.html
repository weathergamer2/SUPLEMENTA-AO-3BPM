<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa de Eventos – Carnaval 2026 (PB)</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <style>
    :root { --bg:#0b1220; --panel:#0f1a2e; --card:#132243; --muted:#9fb0d0; --text:#e7eefc; --accent:#6aa5ff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }

    .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; position: relative; }
    .sidebar { background: var(--panel); border-right: 1px solid rgba(255,255,255,.08); padding: 14px; overflow: auto; }
    #map { width: 100%; height: 100vh; }

    /* Botão flutuante para abrir/fechar filtros */
    .panelToggle {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 9999;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(15,26,46,.82);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .panelToggle:hover { background: rgba(15,26,46,.92); }
    .panelToggle span { font-size: 20px; line-height: 1; }

    .top { display:flex; align-items:center; justify-content:space-between; gap: 8px; margin-bottom: 12px; }
    .title { font-size: 16px; font-weight: 700; letter-spacing:.2px; }
    .hint { font-size: 12px; color: var(--muted); }

    .filters { display: grid; gap: 10px; margin: 10px 0 14px; }
    .row { display: grid; gap: 6px; }
    label { font-size: 12px; color: var(--muted); }
    input, select, button {
      width: 100%;
      padding: 10px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: var(--text);
      outline: none;
    }
    input::placeholder { color: rgba(231,238,252,.55); }
    button {
      background: rgba(106,165,255,.18);
      border: 1px solid rgba(106,165,255,.35);
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { background: rgba(106,165,255,.26); }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      padding: 10px;
    }
    .stat .k { font-size: 11px; color: var(--muted); }
    .stat .v { font-size: 18px; font-weight: 800; margin-top: 4px; }

    .list { display: grid; gap: 10px; }
    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding: 12px;
    }
    .card .line1 { display:flex; justify-content:space-between; gap: 10px; }
    .badge { font-size: 11px; padding: 4px 8px; border-radius: 999px; background: rgba(106,165,255,.18); border: 1px solid rgba(106,165,255,.35); }
    .city { font-size: 14px; font-weight: 800; }
    .meta { margin-top: 6px; font-size: 12px; color: var(--muted); display:flex; gap: 10px; flex-wrap: wrap; }
    .atr { margin-top: 8px; font-size: 12px; }
    .atr ul { margin: 6px 0 0 18px; padding: 0; color: var(--text); }
    .atr li { margin: 2px 0; }
    .card a { color: var(--accent); text-decoration: none; font-weight: 700; }
    .card a:hover { text-decoration: underline; }

    /* Popups Leaflet */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #0f1a2e; color: #e7eefc; border: 1px solid rgba(255,255,255,.10);
    }
    .leaflet-control-attribution { background: rgba(15,26,46,.75) !important; color: #e7eefc; }

    /* MOBILE (padrão: mapa em cima, painel embaixo) */
    @media (max-width: 960px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 52vh 48vh; }
      .sidebar { border-right: none; border-top: 1px solid rgba(255,255,255,.08); }
      #map { height: 52vh; }
      .panelToggle { top: 12px; left: 12px; }
    }

    /* ====== MODO RECOLHIDO (oculta o painel) ====== */
    body.panel-collapsed .sidebar { display: none; }
    body.panel-collapsed .app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    body.panel-collapsed #map { height: 100vh; }

    /* Em desktop, quando recolhe: mapa ocupa tudo */
    @media (min-width: 961px) {
      body.panel-collapsed .app { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

      </div>

      <div class="filters">

          <input id="dateFilter" type="date" />
        </div>

        <div class="row">
          <label for="bpmFilter">Filtrar por batalhão (BPM)</label>
          <select id="bpmFilter">
            <option value="">Todos os batalhões</option>
          </select>
        </div>

        <div class="row">
          <label for="cityFilter">Filtrar por cidade (mostra todos os eventos da cidade)</label>
          <select id="cityFilter">
            <option value="">Todas as cidades</option>
          </select>
        </div>

        <div class="row">
          <label for="minAudience">Público mínimo (estimativa)</label>
          <input id="minAudience" type="number" min="0" step="100" placeholder="Ex.: 5000" />
        </div>

        <div class="row">
          <label for="sortMode">Ordenação</label>
          <select id="sortMode">
            <option value="date">Por data (padrão)</option>
            <option value="audience_desc">Por público (decrescente)</option>
          </select>
        </div>

        <button id="clearBtn" type="button">Limpar filtros</button>
      </div>

      <section class="stats">
        <div class="stat">
          <div class="k">Eventos (filtrados)</div>
          <div class="v" id="eventsCount">0</div>
        </div>
        <div class="stat">
          <div class="k">Cidades (filtradas)</div>
          <div class="v" id="citiesCount">0</div>
        </div>
      </section>

      <section class="list" id="eventsList"></section>
    </aside>
  </div>

      { bpm:"14º BPM", dateISO:"2026-02-07", city:"Sousa", state:"PB", attractions:["Raí Saia Rodada","Grafith","Gilson Mania"], audience:10000, notes:"Baile Verde e Branco (Campestre Clube)" },
      { bpm:"14º BPM", dateISO:"2026-02-11", city:"Sousa", state:"PB", attractions:["Aline Reis"], audience:10000, notes:"Sorri Folia 2026 (Bloco Virgens Jurássicas)" },

      { bpm:"14º BPM", dateISO:"2026-02-15", city:"São Gonçalo", state:"PB", attractions:["JM Puxado","Orquestra Sertão Veredas","Zazuêta"], audience:5000, notes:"Sorri Folia 2026" },
      { bpm:"14º BPM", dateISO:"2026-02-15", city:"Sousa", state:"PB", attractions:["Orquestra Tropicana","Alex Samba","Spydo Rey"], audience:1000, notes:"Sorri Folia 2026 (Clube Enéas Preto)" },
      { bpm:"14º BPM", dateISO:"2026-02-15", city:"Nazarezinho", state:"PB", attractions:["Não divulgada"], audience:2000, notes:"Carnaval de Rua 2026" },

      { bpm:"14º BPM", dateISO:"2026-02-16", city:"São Gonçalo", state:"PB", attractions:["Banda Inala","Breno Andrade","Orquestra Frevura"], audience:5000, notes:"Sorri Folia 2026" },
      { bpm:"14º BPM", dateISO:"2026-02-16", city:"Sousa", state:"PB", attractions:["Não divulgada"], audience:1000, notes:"Sorri Folia 2026 (Clube Enéas Preto)" },

      { bpm:"14º BPM", dateISO:"2026-02-17", city:"Nazarezinho", state:"PB", attractions:["Não divulgada"], audience:2000, notes:"Carnaval de Rua 2026" },
      { bpm:"14º BPM", dateISO:"2026-02-17", city:"São Gonçalo", state:"PB", attractions:["Lucas Tô de Boa","Rekebrança","Lucas Soares"], audience:5000, notes:"Sorri Folia 2026" },
      { bpm:"14º BPM", dateISO:"2026-02-17", city:"Sousa", state:"PB", attractions:["Orquestra Frevura","Lucas Gomes"], audience:1000, notes:"Sorri Folia 2026 (Clube Enéas Preto)" },

      { bpm:"14º BPM", dateISO:"2026-02-21", city:"Sousa", state:"PB", attractions:["Ainda não divulgadas"], audience:10000, notes:"Bloco de Rua: É Mole, Mas É Meu" },

      // ===== 20º BPM =====
      { bpm:"20º BPM", dateISO:"2026-02-13", city:"Princesa Isabel", state:"PB", attractions:["Harmonia Frevo","Galo do Maia","Gisele Sousa","Feitiço de Menina","Wellington Stilo"], audience:5000, notes:"Carnaval de Princesa" },
      { bpm:"20º BPM", dateISO:"2026-02-14", city:"Princesa Isabel", state:"PB", attractions:["Harmonia Frevo e Gil Cantor","Trio Elétrico (Bloco das Virgens)","Wallas Arrais","Lipe Lucena","Efrem"], audience:6000, notes:"Carnaval de Princesa" },
      { bpm:"20º BPM", dateISO:"2026-02-15", city:"Princesa Isabel", state:"PB", attractions:["Dodô Pressão","Ramon Schnayder","Lukas Bass","Hadriel"], audience:6000, notes:"Carnaval de Princesa" },
      { bpm:"20º BPM", dateISO:"2026-02-16", city:"Princesa Isabel", state:"PB", attractions:["Alberto Bakana","Rafale Dono","Walter Lima","Grupo Meu Seu"], audience:5000, notes:"Carnaval de Princesa" },
      { bpm:"20º BPM", dateISO:"2026-02-17", city:"Princesa Isabel", state:"PB", attractions:["Michel Brocador","Lito Lins","Everton Freitas","Klebin"], audience:5000, notes:"Carnaval de Princesa" },

      { bpm:"20º BPM", dateISO:"2026-02-15", city:"Tavares", state:"PB", attractions:["Trio Elétrico (Bloco das Só Nois / Wellington Stilo)"], audience:2000, notes:"Carnaval de Tavares" },
      { bpm:"20º BPM", dateISO:"2026-02-16", city:"Água Branca", state:"PB", attractions:["Trio Elétrico (Bloco das Virgens)"], audience:2000, notes:"Carnaval de Água Branca" },
    ];

    // ===== helpers =====
    const GEO_CACHE_KEY = "geo_cache_v1";
    const geoCache = JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || "{}");

    async function geocodeCity(city, state="PB") {
      const key = `${city}-${state}`;
      if (geoCache[key]) return geoCache[key];

      const q = encodeURIComponent(`${city}, ${state}, Brasil`);
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${q}`;

      const res = await fetch(url, { headers: { "Accept": "application/json" } });
      if (!res.ok) throw new Error("Falha no geocoding");
      const data = await res.json();
      if (!data?.length) throw new Error(`Cidade não encontrada: ${city}`);

      const lat = parseFloat(data[0].lat);
      const lon = parseFloat(data[0].lon);

      geoCache[key] = { lat, lon };
      localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(geoCache));
      return { lat, lon };
    }

    function toBRDate(iso) {
      const [y,m,d] = iso.split("-");
      return `${d}/${m}/${y}`;
    }

    function formatAudience(n) {
      if (n === null || n === undefined || Number.isNaN(n)) return "Não informado";
      return n.toLocaleString("pt-BR");
    }

    function unique(arr) { return Array.from(new Set(arr)); }

    function escapeHTML(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // ===== map =====
    const map = L.map("map").setView([-7.0, -37.3], 7);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap",
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);
    const markersByCity = new Map();

    // ===== UI =====
    const dateFilter = document.getElementById("dateFilter");
    const bpmFilter = document.getElementById("bpmFilter");
    const cityFilter = document.getElementById("cityFilter");
    const minAudience = document.getElementById("minAudience");
    const sortMode = document.getElementById("sortMode");
    const clearBtn = document.getElementById("clearBtn");
    const eventsList = document.getElementById("eventsList");
    const eventsCount = document.getElementById("eventsCount");
    const citiesCount = document.getElementById("citiesCount");

    const panelToggle = document.getElementById("panelToggle");
    const panelToggleIcon = document.getElementById("panelToggleIcon");

    // Toggle painel
    function setPanelCollapsed(isCollapsed) {
      document.body.classList.toggle("panel-collapsed", isCollapsed);
      panelToggleIcon.textContent = isCollapsed ? "☰" : "✕";
      localStorage.setItem("panel_collapsed", isCollapsed ? "1" : "0");
      // Recalcular o mapa ao mudar layout
      setTimeout(() => map.invalidateSize(), 150);
    }

    panelToggle.addEventListener("click", () => {
      const now = document.body.classList.contains("panel-collapsed");
      setPanelCollapsed(!now);
    });

    function populateBpmDropdown() {
      const bpms = unique(EVENTS.map(e => e.bpm).filter(Boolean))
        .sort((a,b) => a.localeCompare(b));
      for (const b of bpms) {
        const opt = document.createElement("option");
        opt.value = b;
        opt.textContent = b;
        bpmFilter.appendChild(opt);
      }
    }

    function populateCityDropdown() {
      const cities = unique(EVENTS.map(e => e.city)).sort((a,b) => a.localeCompare(b));
      for (const c of cities) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        cityFilter.appendChild(opt);
      }
    }

    function getFilteredEvents() {
      const d = dateFilter.value || "";
      const b = bpmFilter.value || "";
      const c = cityFilter.value || "";
      const min = minAudience.value ? Number(minAudience.value) : null;

      return EVENTS.filter(e => {
        if (d && e.dateISO !== d) return false;
        if (b && e.bpm !== b) return false;
        if (c && e.city !== c) return false;
        if (min !== null) {
          if (e.audience === null || e.audience === undefined) return false;
          if (Number(e.audience) < min) return false;
        }
        return true;
      });
    }

    function sortEvents(list) {
      const mode = sortMode.value || "date";
      const arr = list.slice();

      if (mode === "audience_desc") {
        arr.sort((a,b) => {
          const aa = (a.audience === null || a.audience === undefined) ? -1 : Number(a.audience);
          const bb = (b.audience === null || b.audience === undefined) ? -1 : Number(b.audience);
          if (bb !== aa) return bb - aa; // desc
          const dc = a.dateISO.localeCompare(b.dateISO);
          if (dc !== 0) return dc;
          return a.city.localeCompare(b.city);
        });
        return arr;
      }

      // default: date
      arr.sort((a,b) => {
        const dc = a.dateISO.localeCompare(b.dateISO);
        if (dc !== 0) return dc;
        const cc = a.city.localeCompare(b.city);
        if (cc !== 0) return cc;
        const aa = (a.audience === null || a.audience === undefined) ? -1 : Number(a.audience);
        const bb = (b.audience === null || b.audience === undefined) ? -1 : Number(b.audience);
        return bb - aa;
      });
      return arr;
    }

    function buildPopupHTML(city, cityEvents) {
      const sorted = sortEvents(cityEvents);
      const items = sorted.map(e => {
        const atr = (e.attractions?.length
          ? `<ul>${e.attractions.map(x => `<li>${escapeHTML(x)}</li>`).join("")}</ul>`
          : "<em>Sem atrações informadas</em>"
        );

        return `
          <div style="margin:10px 0; padding:10px; border:1px solid rgba(255,255,255,.10); border-radius:12px; background:rgba(255,255,255,.03)">
            <div style="display:flex; justify-content:space-between; gap:10px;">
              <strong>${escapeHTML(city)}</strong>
              <span style="opacity:.85">${toBRDate(e.dateISO)}</span>
            </div>
            <div style="margin-top:6px; font-size:12px; opacity:.85">
              <div><strong>BPM:</strong> ${escapeHTML(e.bpm || "—")}</div>
              <div><strong>Público:</strong> ${formatAudience(e.audience)}</div>
              ${e.notes ? `<div><strong>Evento:</strong> ${escapeHTML(e.notes)}</div>` : ""}
            </div>
            <div style="margin-top:8px; font-size:12px;">
              <strong>Atrações:</strong>
              ${atr}
            </div>
          </div>
        `;
      }).join("");

      return `
        <div style="min-width:280px">
          <div style="font-weight:800; font-size:14px; margin-bottom:6px">${escapeHTML(city)} (eventos)</div>
          ${items || "<em>Nenhum evento para os filtros atuais.</em>"}
        </div>
      `;
    }

    async function buildMarkers(events) {
      markersLayer.clearLayers();
      markersByCity.clear();

      const cities = unique(events.map(e => `${e.city}|${e.state}`));
      for (const cs of cities) {
        const [city, state] = cs.split("|");
        try {
          const { lat, lon } = await geocodeCity(city, state);
          const marker = L.marker([lat, lon]).addTo(markersLayer);
          markersByCity.set(city, marker);

          marker.on("click", () => {
            const cityEvents = getFilteredEvents().filter(e => e.city === city);
            const html = buildPopupHTML(city, cityEvents);
            marker.bindPopup(html, { maxWidth: 360 }).openPopup();
          });
        } catch (err) {
          console.warn(err);
        }
      }
    }

    function renderList(filtered) {
      eventsList.innerHTML = "";
      const sorted = sortEvents(filtered);

      for (const e of sorted) {
        const card = document.createElement("div");
        card.className = "card";

        const atrList = (e.attractions?.length)
          ? `<ul>${e.attractions.map(x => `<li>${escapeHTML(x)}</li>`).join("")}</ul>`
          : `<em>Sem atrações informadas</em>`;

        card.innerHTML = `
          <div class="line1">
            <div class="city">${escapeHTML(e.city)} – ${escapeHTML(e.state)}</div>
            <div class="badge">${toBRDate(e.dateISO)}</div>
          </div>
          <div class="meta">
            ${e.bpm ? `<span><strong>BPM:</strong> ${escapeHTML(e.bpm)}</span>` : ""}
            <span><strong>Público:</strong> ${formatAudience(e.audience)}</span>
            ${e.notes ? `<span><strong>Evento:</strong> ${escapeHTML(e.notes)}</span>` : ""}
          </div>
          <div class="atr">
            <strong>Atrações:</strong>
            ${atrList}
          </div>
          <div style="margin-top:10px;">
            <a href="#" data-city="${escapeHTML(e.city)}">Ver no mapa</a>
          </div>
        `;

        card.querySelector("a").addEventListener("click", (ev) => {
          ev.preventDefault();
          const city = e.city;
          const marker = markersByCity.get(city);
          if (marker) {
            map.setView(marker.getLatLng(), 12, { animate: true });
            marker.fire("click");
          } else {
            alert("Ainda não consegui localizar essa cidade no mapa. (Geocoding falhou)");
          }
        });

        eventsList.appendChild(card);
      }

      eventsCount.textContent = String(filtered.length);
      citiesCount.textContent = String(unique(filtered.map(e => e.city)).length);
    }

    function refresh() {
      const filtered = getFilteredEvents();
      renderList(filtered);
      // Popups atualizam ao clicar (porque usam getFilteredEvents + sortMode)
    }

    clearBtn.addEventListener("click", () => {
      dateFilter.value = "";
      bpmFilter.value = "";
      cityFilter.value = "";
      minAudience.value = "";
      sortMode.value = "date";
      refresh();
    });

    dateFilter.addEventListener("change", refresh);
    bpmFilter.addEventListener("change", refresh);
    cityFilter.addEventListener("change", refresh);
    minAudience.addEventListener("input", refresh);
    sortMode.addEventListener("change", refresh);

    // init
    populateBpmDropdown();
    populateCityDropdown();
    refresh();
    buildMarkers(EVENTS);

    // Restaurar estado do painel
    const saved = localStorage.getItem("panel_collapsed");
    setPanelCollapsed(saved === "1");
  </script>
</body>
</html>
